name: "Release book as PDF"

on:
  push:
    branches:
    - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          
      - name: Fetch release by tag
        id: fetch-release
        uses: pdamianik/release-tag-to-upload-url-action@v1.0.1
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: pdf
          token: ${{ github.token }}
        continue-on-error: true
        
      - uses: dev-drprasad/delete-tag-and-release@v1.1
        name: Delete release if already existing
        with:
          delete_release: true 
          tag_name: pdf
          github_token: ${{ secrets.GITHUB_TOKEN }}
        if: steps.fetch-release.outcome == 'success'
                    
      - name: Create release
        id: create-release
        uses: avakar/tag-and-release@v1
        with:
          tag_name: pdf
          release_name: thesis
          body: Prebuilt PDF of the thesis.
          prerelease: false
          draft: false
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Upload pdf book
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }} 
          asset_path: main.pdf
          asset_name: thesis.pdf
          asset_content_type: application/pdf
